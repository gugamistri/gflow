<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capturar</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef5f8;
      color: #1a1a1a;
    }
    .bar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #d6e8f0;
      background: #ffffff;
    }
    input[type="url"] {
      flex: 1;
      min-width: 0;
      height: 36px;
      border: 1px solid #d6e8f0;
      border-radius: 4px;
      padding: 0 10px;
      font: inherit;
    }
    button {
      height: 36px;
      border-radius: 4px;
      border: 1px solid #d6e8f0;
      background: #eef5f8;
      color: #1a4d6d;
      font: inherit;
      font-weight: 600;
      padding: 0 12px;
      cursor: pointer;
    }
    button.primary {
      background: #1a4d6d;
      border-color: #1a4d6d;
      color: #fff;
    }
    button.danger {
      background: #fff;
      border-color: #fecaca;
      color: #dc2626;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 160px;
      max-width: 220px;
    }
    .count { font-weight: 700; color: #1a4d6d; font-size: 13px; }
    .status { font-size: 11px; color: #71717a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status.is-error { color: #dc2626; }
    .hint {
      position: absolute;
      left: 12px;
      top: 68px;
      font-size: 11px;
      color: #71717a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bar">
    <input type="url" id="url" placeholder="https://produto.exemplo.com" spellcheck="false" />
    <button type="button" id="btn-go">Abrir</button>
    <button type="button" id="btn-start">Iniciar</button>
    <div class="meta">
      <span class="count" id="count">0 passos</span>
      <span class="status" id="status">Só captura o que estiver nesta janela.</span>
    </div>
    <button type="button" class="primary" id="btn-capture">Capturar</button>
    <button type="button" class="primary" id="btn-create">Criar projeto</button>
    <button type="button" id="btn-undo">Desfazer</button>
    <button type="button" class="danger" id="btn-cancel">Fechar</button>
  </div>
  <p class="hint">Capturar congela a tela · clique no elemento para marcar o destaque</p>
  <script src="capture-ui.js"></script>
</body>
</html>
